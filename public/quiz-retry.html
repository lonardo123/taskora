<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing...</title>
<style>
  body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
  .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
    <h3>🔄 Preparing Retry...</h3>
  <p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">Verifying with server</p>

    <script>
    async function complete() {
      // 1. جلب البيانات من sessionStorage فقط (أكثر موثوقية في AppCreator24)
      const userId = sessionStorage.getItem('quiz_user_id');
      const rewardId = sessionStorage.getItem('quiz_reward_id');
      
      // 2. ✅ إذا كانت البيانات مفقودة، نعود لصفحة الكويز فوراً وبصمت (بدون عرض أي خطأ)
      if (!userId || !rewardId) {
        window.location.href = 'quiz.html';
        return;
      }

      try {
        const res = await fetch('https://taskora.taskora.workers.dev/api/quiz/reward/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rewardId, userId: userId })
        });
        
        const data = await res.json();
        
        // 3. تنظيف البيانات بعد الاستخدام
        sessionStorage.removeItem('quiz_user_id');
        sessionStorage.removeItem('quiz_reward_id');
        sessionStorage.removeItem('quiz_reward_action');
        sessionStorage.removeItem('quiz_reward_question_id');
        
        // 4. العودة إلى صفحة الكويز الرئيسية لتحديث الحالة
        window.location.href = `quiz.html?user_id=${userId}`;
        
      } catch (e) {
        console.error(e);
        // في حال فشل الاتصال، نعود أيضاً لصفحة الكويز بصمت
        window.location.href = `quiz.html?user_id=${userId}`;
      }
    }
    
    // تنفيذ الدالة فور تحميل الصفحة
    window.onload = complete;
  </script>
</body>
</html>
