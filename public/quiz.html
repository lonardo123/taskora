<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taskora Quiz</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 15px; }
  
  /* Header Stats */
  .header-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
  .stat-box { background: var(--bg-card); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
  .stat-box .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .value { font-size: 18px; font-weight: 700; color: var(--warning); margin-top: 4px; }
  
  /* Controls */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .lang-select { background: var(--bg-card); color: var(--text-primary); border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; }
  .convert-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }

  /* Timer Bar */
  .timer-container { background: var(--bg-card); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
  .timer-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .timer-bar-bg { background: var(--bg-input); height: 8px; border-radius: 4px; overflow: hidden; }
  .timer-bar-fill { background: linear-gradient(90deg, var(--success), var(--warning), var(--danger)); height: 100%; width: 100%; transition: width 1s linear; }
  .timer-bar-fill.danger { background: var(--danger); animation: pulse 1s infinite; }

  /* Question Card */
  .question-card { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 15px; }
  .q-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
  .q-meta span.badge { background: var(--bg-input); padding: 4px 8px; border-radius: 6px; }
  .q-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; min-height: 60px; }
  
  /* Answers */
  .answers-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .answer-btn { background: var(--bg-input); color: var(--text-primary); border: 2px solid transparent; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-align: left; }
  .answer-btn:hover { border-color: var(--accent); background: #1e3a8a; }
  .answer-btn.correct { border-color: var(--success); background: #064e3b; color: #86efac; }
  .answer-btn.wrong { border-color: var(--danger); background: #7f1d1d; color: #fca5a5; }
  .answer-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Action Buttons (Double/Retry/Skip) */
  .action-area { display: none; text-align: center; margin-top: 20px; animation: fadeIn 0.3s ease; }
  .action-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-double { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
  .btn-retry { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
  .btn-skip { background: linear-gradient(135deg, #64748b, #475569); color: white; }
  .btn-next { background: linear-gradient(135deg, var(--success), #16a34a); color: white; }

  /* Leaderboard */
  .leaderboard { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-top: 20px; }
  .lb-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .lb-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 14px; }
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { width: 30px; font-weight: 700; color: var(--warning); }


/* ================= CONVERT POINTS MODAL ================= */

.convert-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(15, 23, 42, 0.88);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.convert-modal-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  animation: fadeIn 0.25s ease;
}

.convert-modal-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: center;
}

.convert-modal-info {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
  margin-bottom: 18px;
}

.convert-available {
  background: var(--bg-input);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  margin-bottom: 15px;
}

.convert-available-label {
  display: block;
  color: var(--text-secondary);
  font-size: 12px;
  margin-bottom: 5px;
}

.convert-available-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--warning);
}

.convert-input {
  width: 100%;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 2px solid #475569;
  border-radius: 10px;
  padding: 14px;
  font-size: 17px;
  outline: none;
  text-align: center;
}

.convert-input:focus {
  border-color: var(--accent);
}

.convert-amount {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(59, 130, 246, 0.12);
  text-align: center;
  font-size: 14px;
  color: var(--text-secondary);
}

.convert-amount strong {
  color: var(--success);
  font-size: 18px;
}

.convert-error {
  display: none;
  margin-top: 10px;
  color: #fca5a5;
  background: rgba(127, 29, 29, 0.35);
  border: 1px solid #7f1d1d;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  font-size: 13px;
}

.convert-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.convert-confirm,
.convert-cancel {
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.convert-confirm {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
}

.convert-cancel {
  background: #475569;
  color: white;
}

.convert-confirm:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
  
  
  /* Loading & Messages */
  .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--bg-input); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</has context>
</style>
</head>

<div class="timer-container">

  </div>

  </div>
</div>

<!-- Question Area -->
<div class="question-card" id="questionArea">

    <span class="badge" id="qDifficulty">⭐</span>
    <span class="badge" id="qLeft">Left: 200</span>
  </div>
  <div class="q-text" id="qText">Loading question...</div>
  <div class="answers-grid" id="answersGrid"></div>
  
  <!-- Action Area (Hidden by default) -->
  <div class="action-area" id="actionArea">
    <h3 id="actionTitle" style="margin-bottom: 15px; font-size: 18px;"></h3>
     <button
  id="btnDouble"
  class="action-btn btn-double"
  onclick="requestReward('double')"
>
  🎬 <span data-i18n="doublePoints">Double Points</span>
</button>

<button
  id="btnNext"
  class="action-btn btn-next"
  onclick="loadQuestion()"
  style="display:none;"
>
  ➡️ <span data-i18n="next">Next Question</span>
</button>

<button
  id="btnRetry"
  class="action-btn btn-retry"
  onclick="requestReward('retry')"
>
  🔄 <span data-i18n="retry">Retry Question</span>
</button>

<button
  id="btnSkip"
  class="action-btn btn-skip"
  onclick="requestReward('skip')"
>
  ⏭️ <span data-i18n="skip">Skip Question</span>
</button>
  </div>
</div>

<!-- Leaderboard -->
<div class="leaderboard">
  <div class="lb-title">🏆 <span data-i18n="leaderboard">Weekly Leaderboard</span></div>
  <div id="leaderboardList">
    <div class="lb-item" style="justify-content: center; color: var(--text-secondary);">Loading...</div>
  </div>
</div>


<!-- Convert Points Modal -->
<div id="convertModal" class="convert-modal">

  <div class="convert-modal-card">

    <div class="convert-modal-title" data-i18n="convertTitle">
      Convert Points
    </div>

    <div class="convert-modal-info" data-i18n="convertInfo">
      Convert your quiz points to your account balance.
    </div>

    <div class="convert-available">
      <span class="convert-available-label" data-i18n="availablePoints">
        Available Points
      </span>

      <div
        id="convertAvailablePoints"
        class="convert-available-value"
      >
        0
      </div>
    </div>

    <input
      id="convertPointsInput"
      class="convert-input"
      type="number"
      min="1000"
      step="1"
      inputmode="numeric"
      placeholder="Enter points"
      oninput="updateConvertAmount()"
    >

    <div class="convert-amount">
      <span data-i18n="youWillReceive">
        You will receive:
      </span>

      <strong id="convertUsdAmount">
        $0.00
      </strong>
    </div>

    <div
      id="convertError"
      class="convert-error"
    ></div>

    <div class="convert-actions">

      <button
        type="button"
        class="convert-cancel"
        onclick="closeConvertModal()"
        data-i18n="cancel"
      >
        Cancel
      </button>

      <button
        type="button"
        id="convertConfirmBtn"
        class="convert-confirm"
        onclick="submitPointsConversion()"
        data-i18n="confirm"
      >
        Confirm
      </button>

    </div>

  </div>

</div>

// ================= INITIALIZATION =================
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  quizUserId = urlParams.get('user_id')?.trim();
  
  if (!quizUserId || !/^\d+$/.test(quizUserId)) {
    document.body.innerHTML = '<div style="text-align:center;padding:50px;color:#ef4444;">Invalid or missing user_id in URL.</div>';
    return;
  }

 document.getElementById('langSelect').value = currentLang;
applyTranslations();

loadUserDataAndQuestion();
});

// ================= CORE FUNCTIONS =================
function applyTranslations() {
  const t = translations[currentLang] || translations.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('quiz_language', lang);
  applyTranslations();
  loadQuestion(); // إعادة تحميل السؤال باللغة الجديدة
}

async function loadUserDataAndQuestion() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  try {
    // 1. جلب بيانات المستخدم والمتصدرين
    const res = await fetch(`${API_BASE}/api/quiz/points?user_id=${quizUserId}`);
    const data = await res.json();
    if (data.success) {
      document.getElementById('statPoints').textContent = data.points;
      document.getElementById('statToday').textContent = data.questions_today;
      document.getElementById('statWeekly').textContent = data.weekly_score;
      renderLeaderboard(data.leaderboard);
    }
    // 2. جلب السؤال
    await loadQuestion();
  } catch (err) {
    console.error('Init error:', err);
    document.getElementById('loadingText').textContent = 'Connection Error. Tap to retry.';
    document.getElementById('loadingOverlay').onclick = loadUserDataAndQuestion;
  }
}


// ================= TIMER LOGIC =================
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 30;
  updateTimerUI();
  
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timerText').textContent = timeLeft + 's';
  const bar = document.getElementById('timerBar');
  bar.style.width = (timeLeft / 60 * 100) + '%';
  if (timeLeft <= 10) bar.classList.add('danger');
  else bar.classList.remove('danger');
}

function handleTimeUp() {
  disableAnswers();
  showActionArea('timeUp', 'skip');
}

// ================= ANSWER LOGIC =================
async function submitAnswer(answerIndex) {
  clearInterval(timerInterval);
  disableAnswers();

  try {
    const res = await fetch(
      `${API_BASE}/api/quiz/answer`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          userId: quizUserId,
          questionId: currentQuestionId,
          answerIndex
        })
      }
    );

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(
        data.message || 'Answer failed'
      );
    }

    const btns =
      document.querySelectorAll('.answer-btn');

    if (
      data.correctIndex !== undefined &&
      btns[data.correctIndex]
    ) {
      btns[data.correctIndex]
        .classList.add('correct');
    }

    if (data.correct) {

      // المستخدم حصل بالفعل على +1
      // من السيرفر في /api/quiz/answer
      showActionArea(
        'correct',
        'double'
      );

      // تحديث النقاط في الخلفية
      // حتى لا نؤخر ظهور الأزرار
      fetch(
        `${API_BASE}/api/quiz/points?user_id=${quizUserId}`
      )
        .then(res => res.json())
        .then(ptsData => {

          if (ptsData.success) {

            document.getElementById(
              'statPoints'
            ).textContent =
              ptsData.points;

            document.getElementById(
              'statToday'
            ).textContent =
              ptsData.questions_today;

            document.getElementById(
              'statWeekly'
            ).textContent =
              ptsData.weekly_score;
          }

        })
        .catch(err => {
          console.warn(
            'Background points update failed:',
            err
          );
        });

    } else {

      btns[answerIndex]
        ?.classList.add('wrong');

      showActionArea(
        'wrong',
        'retry'
      );
    }

  } catch (err) {

    console.error(
      'Submit error:',
      err
    );

    loadQuestion();
  }
}

function disableAnswers() {
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.disabled = true;
    btn.style.cursor = 'default';
  });
}

function showActionArea(resultKey, primaryAction) {
  const t = translations[currentLang] || translations.en;
  const area = document.getElementById('actionArea');
  const title = document.getElementById('actionTitle');
  
  document.getElementById('btnDouble').style.display =
  primaryAction === 'double'
    ? 'flex'
    : 'none';

document.getElementById('btnRetry').style.display =
  primaryAction === 'retry'
    ? 'flex'
    : 'none';

document.getElementById('btnSkip').style.display =
  primaryAction === 'skip'
    ? 'flex'
    : 'none';

document.getElementById('btnNext').style.display =
  resultKey === 'correct'
    ? 'flex'
    : 'none';
  if (resultKey === 'correct') {
    title.textContent = t.correct;
    title.style.color = 'var(--success)';
    document.getElementById('btnDouble').querySelector('span').textContent = t.watchAdDouble;
  } else if (resultKey === 'wrong') {
    title.textContent = t.wrong;
    title.style.color = 'var(--danger)';
    document.getElementById('btnRetry').querySelector('span').textContent = t.watchAdRetry;
  } else {
    title.textContent = t.timeUp;
    title.style.color = 'var(--warning)';
    document.getElementById('btnSkip').querySelector('span').textContent = t.watchAdSkip;
  }
  
  area.style.display = 'block';
}

// ================= دالة تحميل السؤال (سريعة ومترجمة) =================
let questionLoadAttempts = 0;
const MAX_LOAD_ATTEMPTS = 2; // تقليل المحاولات لزيادة السرعة

async function loadQuestion() {
  const overlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  
  if (overlay) overlay.style.display = 'flex';
  document.getElementById('actionArea').style.display = 'none';
  document.getElementById('answersGrid').innerHTML = '';
  
  questionLoadAttempts++;
  
  try {
    localStorage.setItem('quiz_user_id', quizUserId);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000); // مهلة 4 ثواني كحد أقصى

    const res = await fetch(`${API_BASE}/api/quiz/question?user_id=${quizUserId}&lang=${currentLang}`, {
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    
    const data = await res.json();
    
    // ✅ معالجة الحد اليومي برسالة مترجمة
    if (!data.success) {
      if (data.message === 'DAILY_LIMIT') {
        if (overlay) overlay.style.display = 'none';
        
        // ترجمات رسالة الحد اليومي
        const limitMessages = {
          ar: '🎉 لقد وصلت للحد اليومي (200 سؤال). عد غداً لمزيد من التحديات!',
          en: '🎉 Daily limit (200 questions) reached. Come back tomorrow!',
          fr: '🎉 Limite quotidienne (200 questions) atteinte. Revenez demain !',
          es: '🎉 Límite diario (200 preguntas) alcanzado. ¡Vuelve mañana!',
          pt: '🎉 Limite diário (200 perguntas) atingido. Volte amanhã!',
          de: '🎉 Tageslimit (200 Fragen) erreicht. Kommen Sie morgen wieder!',
          ja: '🎉 1日の制限（200問）に達しました。明日またお越しください！'
        };
        
        document.getElementById('qText').textContent = limitMessages[currentLang] || limitMessages['en'];
        document.getElementById('qCategory').textContent = '🏆';
        document.getElementById('qDifficulty').textContent = '';
        document.getElementById('qLeft').textContent = '0';
        document.getElementById('answersGrid').innerHTML = '';
        clearInterval(timerInterval);
        return;
      }
      
      if (data.message === 'API_UNAVAILABLE') {
        throw new Error(currentLang === 'ar' ? 'خدمة الأسئلة غير متاحة حالياً، يرجى المحاولة لاحقاً.' : 'Question service unavailable, please try again.');
      }
      
      throw new Error(data.message || 'Unknown error');
    }

    // ✅ نجاح التحميل، إعادة تعيين العداد
    questionLoadAttempts = 0;

    currentQuestionId = data.questionId;
    document.getElementById('qCategory').textContent = data.category;
    document.getElementById('qDifficulty').textContent = data.difficulty === 'easy' ? '⭐' : data.difficulty === 'medium' ? '⭐⭐' : '⭐⭐⭐';
    document.getElementById('qLeft').textContent = (currentLang === 'ar' ? 'متبقي: ' : 'Left: ') + data.questionsLeft;
    document.getElementById('qText').textContent = data.question;

    const grid = document.getElementById('answersGrid');
    data.answers.forEach((ans, idx) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = ans;
      btn.onclick = () => submitAnswer(idx);
      grid.appendChild(btn);
    });
let answerUnlockTimeout = null;

function lockAnswersForInitialDelay() {
    clearTimeout(answerUnlockTimeout);

    const buttons = document.querySelectorAll('.answer-btn');

    buttons.forEach(btn => {
        btn.disabled = true;
        btn.style.cursor = 'not-allowed';
    });

    answerUnlockTimeout = setTimeout(() => {
        if (!currentQuestionId || timeLeft <= 0) {
            return;
        }

        document.querySelectorAll('.answer-btn').forEach(btn => {
            btn.disabled = false;
            btn.style.cursor = 'pointer';
        });

    }, 10000);
}
    if (overlay) overlay.style.display = 'none';

lockAnswersForInitialDelay();
startTimer();

  } catch (err) {
    console.warn(`Attempt ${questionLoadAttempts} failed:`, err.message);
    
    if (questionLoadAttempts >= MAX_LOAD_ATTEMPTS) {
      if (overlay) overlay.style.display = 'none';
      document.getElementById('questionArea').innerHTML = `
        <div style="text-align:center;padding:40px 20px;">
          <div style="font-size:64px;margin-bottom:20px;">⚠️</div>
          <h3 style="color:#fbbf24;margin-bottom:15px;">${currentLang === 'ar' ? 'تعذر تحميل السؤال' : 'Failed to Load'}</h3>
          <p style="color:#94a3b8;margin-bottom:20px;">${err.message}</p>
          <button onclick="resetAndRetry()" style="padding:12px 30px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;">
            🔄 ${currentLang === 'ar' ? 'إعادة المحاولة' : 'Try Again'}
          </button>
        </div>
      `;
      return;
    }
    
    // إعادة محاولة سريعة
    setTimeout(() => loadQuestion(), 1000);
  }
}

// دالة إعادة التعيين عند الضغط على "Try Again"
function resetAndRetry() {
  questionLoadAttempts = 0;
  document.getElementById('questionArea').innerHTML = `
    <div class="q-meta">
      <span class="badge" id="qCategory">Category</span>
      <span class="badge" id="qDifficulty">⭐</span>
      <span class="badge" id="qLeft">Left: 200</span>
    </div>
    <div class="q-text" id="qText">Loading question...</div>
    <div class="answers-grid" id="answersGrid"></div>
    <div class="action-area" id="actionArea">
      <h3 id="actionTitle" style="margin-bottom: 15px; font-size: 18px;"></h3>
      <button
  id="btnDouble"
  class="action-btn btn-double"
  onclick="requestReward('double')"
>
  🎬 <span data-i18n="doublePoints">Double Points</span>
</button>

<button

>

</button>

<button

<button

>
  ⏭️ <span data-i18n="skip">Skip Question</span>

    </div>
  `;
  applyTranslations();

}
// ================= دالة طلب المكافأة (بدون أي رسائل مزعجة) =================
async function requestReward(action) {
  // إخفاء أي شيء وعرض تحميل بسيط جداً
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.style.display = 'flex';
    document.getElementById('loadingText').textContent = currentLang === 'ar' ? 'جاري التحضير...' : 'Preparing...';
  }

  try {
    const res = await fetch(`${API_BASE}/api/quiz/reward/create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: quizUserId, questionId: currentQuestionId, action })
    });
    const data = await res.json();
    
    if (!data.success) {
      if (overlay) overlay.style.display = 'none';
      loadQuestion(); // عودة صامتة للسؤال التالي في حال الفشل
      return;
    }
    
    // ✅ الحفظ المضمون في localStorage (أفضل من sessionStorage في AppCreator24)
    localStorage.setItem('quiz_user_id', quizUserId);
    localStorage.setItem('quiz_reward_id', data.rewardId);
    localStorage.setItem('quiz_reward_action', action);
    localStorage.setItem('quiz_reward_question_id', currentQuestionId);
    
    // التوجيه إلى قسم AppCreator24
    let ac24Ref = '';
    if (action === 'double') ac24Ref = 'quiz-doub';
    else if (action === 'retry') ac24Ref = 'quiz-retry';
    else if (action === 'skip') ac24Ref = 'quiz-skip';
    
    setTimeout(() => {
      window.location.href = `go:${ac24Ref}`;
    }, 300);
    
  } catch (err) {
    console.error('Reward request error:', err);
    if (overlay) overlay.style.display = 'none';
    loadQuestion(); // عودة صامتة
  }
}


// ================= UTILS =================
function renderLeaderboard(data) {
  const list = document.getElementById('leaderboardList');
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="lb-item" style="justify-content: center; color: var(--text-secondary);">No data yet</div>';
    return;
  }
  list.innerHTML = data.map((row, i) => `
    <div class="lb-item">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="lb-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)}</span>
        <span>@${row.username || 'User'}</span>
      </div>
      <span style="font-weight:700;color:var(--warning);">${row.weekly_score} pts</span>
    </div>
  `).join('');
}

// ================= CONVERT POINTS =================

let currentQuizPoints = 0;
let quizConversionRate = 0.10;
let quizMinimumConversionPoints = 1000;

async function convertPoints() {

  const modal = document.getElementById('convertModal');

  if (!modal) {
    console.error('Convert modal not found');
    return;
  }

  // تحميل أحدث بيانات النقاط قبل فتح النافذة
  try {

    const res = await fetch(
      `${API_BASE}/api/quiz/points?user_id=${quizUserId}`
    );

    const data = await res.json();

    if (data.success) {

      currentQuizPoints =
        Number(data.points || 0);

      if (data.settings) {

        quizConversionRate =
          Number(
            data.settings.points_per_1000 ?? 0.10
          );

        quizMinimumConversionPoints =
          Number(
            data.settings.min_conversion_points ?? 1000
          );

      }

    }

  } catch (err) {

    console.error(
      'Failed to load quiz points:',
      err
    );

    currentQuizPoints =
      Number(
        document.getElementById('statPoints')?.textContent || 0
      );
  }

  document.getElementById(
    'convertAvailablePoints'
  ).textContent =
    currentQuizPoints;

  const input =
    document.getElementById(
      'convertPointsInput'
    );

  input.value = '';

  input.min =
    quizMinimumConversionPoints;

  document.getElementById(
    'convertUsdAmount'
  ).textContent =
    '$0.00';

  document.getElementById(
    'convertError'
  ).style.display =
    'none';

  modal.style.display = 'flex';

  setTimeout(() => {
    input.focus();
  }, 100);
}

function updateConvertAmount() {

  const input =
    document.getElementById(
      'convertPointsInput'
    );

  const amount =
    document.getElementById(
      'convertUsdAmount'
    );

  const requested =
    Number(input.value || 0);

  if (
    !Number.isFinite(requested) ||
    requested <= 0
  ) {
    amount.textContent =
      '$0.00';

    return;
  }

  const usd =
    (requested / 1000) *
    quizConversionRate;

  amount.textContent =
    '$' +
    usd.toFixed(2);
 }

 function closeConvertModal() {

  const modal =
    document.getElementById(
      'convertModal'
    );

  if (modal) {
    modal.style.display = 'none';
  }

  const error =
    document.getElementById(
      'convertError'
    );

  if (error) {
    error.style.display = 'none';
  }
} 

async function submitPointsConversion() {

  const input =
    document.getElementById(
      'convertPointsInput'
    );

  const errorBox =
    document.getElementById(
      'convertError'
    );

  const confirmBtn =
    document.getElementById(
      'convertConfirmBtn'
    );

  const requested =
    Number(
      input.value
    );

  const t =
    translations[currentLang] ||
    translations.en;

  errorBox.style.display =
    'none';

  // =========================
  // VALIDATION
  // =========================

  if (
    !Number.isInteger(requested) ||
    requested <= 0
  ) {

    errorBox.textContent =
      t.invalidPoints;

    errorBox.style.display =
      'block';

    return;
  }

  if (
    requested <
    quizMinimumConversionPoints
  ) {

    errorBox.textContent =
  t.minimumPoints(quizMinimumConversionPoints);

    errorBox.style.display =
      'block';

    return;
  }

  if (
    requested >
    currentQuizPoints
  ) {

    errorBox.textContent =
      t.insufficientPoints;

    errorBox.style.display =
      'block';

    return;
  }

  // منع الضغط المتكرر
  confirmBtn.disabled = true;

  try {

    const response =
      await fetch(
        `${API_BASE}/api/quiz/convert`,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            userId:
              quizUserId,

            pointsToConvert:
              requested
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok ||
        !data.success) {

      errorBox.textContent =
        data.message ||
        t.conversionFailed;

      errorBox.style.display =
        'block';

      return;
    }

    // تحديث النقاط المحلية
    currentQuizPoints =
      Number(
        data.remaining_points || 0
      );

    document.getElementById(
      'statPoints'
    ).textContent =
      currentQuizPoints;

    document.getElementById(
      'convertAvailablePoints'
    ).textContent =
      currentQuizPoints;

    input.value = '';

    document.getElementById(
      'convertUsdAmount'
    ).textContent =
      '$0.00';

    // إغلاق النافذة بعد النجاح
    closeConvertModal();

    // تحديث بيانات الصفحة
    await loadUserDataAndQuestion();

  } catch (err) {

    console.error(
      'Quiz conversion error:',
      err
    );

    errorBox.textContent =
      t.conversionFailed;

    errorBox.style.display =
      'block';

  } finally {

    confirmBtn.disabled =
      false;
  }
}

  
</script>
