<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Taskora Quiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .quiz-container {
      width: min(720px, 94%);
      margin: 30px auto;
    }

    .quiz-header,
    .quiz-card,
    .quiz-result,
    .quiz-convert-box,
    .quiz-leaderboard {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .quiz-header h2 {
      margin: 0 0 5px;
    }

    .quiz-header p {
      margin: 0;
      color: #666;
    }

    #quiz-language {
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .quiz-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .quiz-stat-card {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .quiz-stat-card span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .quiz-stat-card strong {
      font-size: 22px;
    }

    .quiz-convert-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .quiz-convert-box small {
      display: block;
      color: #777;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    #quiz-convert-btn,
    #quiz-next-btn {
      background: #222;
      color: #fff;
    }

    .quiz-question-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .quiz-timer-box {
      text-align: center;
      margin: 15px 0;
    }

    #quiz-timer {
      font-size: 40px;
      font-weight: bold;
    }

    #quiz-timer-label {
      color: #777;
    }

    .quiz-loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .quiz-question-card h3 {
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .quiz-answers {
      display: grid;
      gap: 10px;
    }

    .quiz-answer-btn {
      width: 100%;
      background: #f0f2f6;
      text-align: left;
    }

    .quiz-answer-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .quiz-reward-actions {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    #quiz-double-btn,
    #quiz-retry-btn,
    #quiz-skip-btn {
      background: #222;
      color: #fff;
    }

    .quiz-result {
      text-align: center;
    }

    #quiz-result-icon {
      font-size: 45px;
    }

    #quiz-result-title {
      margin-bottom: 8px;
    }

    #quiz-result-message {
      color: #666;
    }

    #quiz-limit {
      display: none;
      padding: 15px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .quiz-leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    @media (max-width: 600px) {
      .quiz-header {
        flex-direction: column;
        align-items: stretch;
      }

      .quiz-stats {
        grid-template-columns: 1fr;
      }

      .quiz-question-info {
        flex-direction: column;
      }

      .quiz-convert-box {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

function applyQuizTranslations() {

  const t =
    quizTranslations[quizCurrentLanguage] ||
    quizTranslations.en;

  const map = {
    "quiz-title": t.title,
    "quiz-subtitle": t.subtitle,
    "quiz-points-label": t.points,
    "quiz-today-label": t.today,
    "quiz-weekly-label": t.weekly,
    "quiz-convert-btn": t.convert,
    "quiz-convert-title": t.convertTitle,
    "quiz-convert-info": t.convertInfo,
    "quiz-category-label": t.category,
    "quiz-difficulty-label": t.difficulty,
    "quiz-left-label": t.left,
    "quiz-timer-label": t.seconds,
    "quiz-loading": t.loading,
    "quiz-double-btn": t.double,
    "quiz-retry-btn": t.retry,
    "quiz-skip-btn": t.skip,
    "quiz-next-btn": t.next,
    "quiz-leaderboard-title": t.leaderboard
  };

  Object.entries(map).forEach(
    ([id, text]) => {

      const el =
        document.getElementById(id);

      if (el) {
        el.textContent = text;
      }

    }
  );

  document.documentElement.lang =
    quizCurrentLanguage;

  document.documentElement.dir =
    quizCurrentLanguage === "ar"
      ? "rtl"
      : "ltr";
}

function changeQuizLanguage() {

  const select =
    document.getElementById(
      "quiz-language"
    );

  if (!select) return;

  quizCurrentLanguage =
    select.value;

  localStorage.setItem(
    "quiz_language",
    quizCurrentLanguage
  );

  applyQuizTranslations();

  loadQuizQuestion();
}

async function loadQuizPage() {

  const userId =
    getQuizUserId();

  if (!userId) {
    alert("Please login first.");
    return;
  }

  const select =
    document.getElementById(
      "quiz-language"
    );

  if (select) {
    select.value =
      quizCurrentLanguage;
  }

  applyQuizTranslations();

  await loadQuizPoints();

  await loadQuizQuestion();
}

async function loadQuizQuestion() {

  const userId =
    getQuizUserId();

  if (!userId) return;

  stopQuizTimer();

  quizAnswered = false;
  quizQuestionId = null;

  const loading =
    document.getElementById(
      "quiz-loading"
    );

  const question =
    document.getElementById(
      "quiz-question"
    );

  const answers =
    document.getElementById(
      "quiz-answers"
    );

  const result =
    document.getElementById(
      "quiz-result"
    );

  if (loading) {
    loading.style.display =
      "block";
  }

  if (question) {
    question.style.display =
      "none";
  }

  if (answers) {
    answers.innerHTML = "";
  }

  if (result) {
    result.style.display =
      "none";
  }

  try {

    const response =
      await fetch(
        `${API}/api/quiz/question` +
        `?user_id=${encodeURIComponent(userId)}` +
        `&lang=${encodeURIComponent(quizCurrentLanguage)}`
      );

    const data =
      await response.json();

    if (!data.success) {

      if (
        data.message ===
        "DAILY_LIMIT"
      ) {

        showQuizLimit(
          quizTranslations[
            quizCurrentLanguage
          ]?.dailyLimit ||
          "Daily limit reached."
        );

      } else {

        showQuizLimit(
          data.message ||
          "No question available."
        );

      }

      if (loading) {
        loading.style.display =
          "none";
      }

      return;
    }

    const limit =
      document.getElementById(
        "quiz-limit"
      );

    if (limit) {
      limit.style.display =
        "none";
    }

    quizQuestionId =
      data.questionId;

    document.getElementById(
      "quiz-category"
    ).textContent =
      data.category || "-";

    document.getElementById(
      "quiz-difficulty"
    ).textContent =
      data.difficulty || "-";

    document.getElementById(
      "quiz-left"
    ).textContent =
      Number(
        data.questionsLeft || 0
      );

    if (question) {

      question.textContent =
        data.question;

      question.style.display =
        "block";
    }

    if (answers) {

      data.answers.forEach(
        (answer, index) => {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "quiz-answer-btn";

          button.textContent =
            answer;

          button.onclick =
            () =>
              submitQuizAnswer(
                index
              );

          answers.appendChild(
            button
          );

        }
      );

    }

    if (loading) {
      loading.style.display =
        "none";
    }

    startQuizTimer();

  } catch (error) {

    console.error(
      "Quiz question error:",
      error
    );

    if (loading) {
      loading.textContent =
        "Unable to load question.";
    }
  }
}

async function submitQuizAnswer(
  answerIndex
) {

  if (
    quizAnswered ||
    !quizQuestionId
  ) {
    return;
  }

  const userId =
    getQuizUserId();

  if (!userId) return;

  quizAnswered = true;

  stopQuizTimer();

  document
    .querySelectorAll(
      ".quiz-answer-btn"
    )
    .forEach(
      btn =>
        btn.disabled = true
    );

  try {

    const response =
      await fetch(
        `${API}/api/quiz/answer`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              questionId:
                quizQuestionId,

              answerIndex:
                answerIndex,

              userId:
                userId
            })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "Unable to submit answer."
      );

      return;
    }

    await loadQuizPoints();

    showQuizResult(
      data.correct,
      false
    );

  } catch (error) {

    console.error(
      "Quiz answer error:",
      error
    );

    alert(
      "Unable to submit answer."
    );
  }
}

function showQuizResult(
  correct,
  timeUp
) {

  const result =
    document.getElementById(
      "quiz-result"
    );

  const icon =
    document.getElementById(
      "quiz-result-icon"
    );

  const title =
    document.getElementById(
      "quiz-result-title"
    );

  const message =
    document.getElementById(
      "quiz-result-message"
    );

  const rewards =
    document.getElementById(
      "quiz-reward-actions"
    );

  const next =
    document.getElementById(
      "quiz-next-btn"
    );

  const t =
    quizTranslations[
      quizCurrentLanguage
    ] ||
    quizTranslations.en;

  if (!result) return;

  result.style.display =
    "block";

  if (timeUp) {

    icon.textContent = "⏰";
    title.textContent = t.timeup;
    message.textContent =
      t.watchSkip;

    rewards.style.display =
      "grid";

    document.getElementById(
      "quiz-double-btn"
    ).style.display =
      "none";

    document.getElementById(
      "quiz-retry-btn"
    ).style.display =
      "none";

    document.getElementById(
      "quiz-skip-btn"
    ).style.display =
      "block";

    next.style.display =
      "none";

    return;
  }

  if (correct) {

    icon.textContent = "✅";
    title.textContent = t.correct;
    message.textContent =
      t.watchDouble;

    rewards.style.display =
      "grid";

    document.getElementById(
      "quiz-double-btn"
    ).style.display =
      "block";

    document.getElementById(
      "quiz-retry-btn"
    ).style.display =
      "none";

    document.getElementById(
      "quiz-skip-btn"
    ).style.display =
      "none";

    next.style.display =
      "block";

  } else {

    icon.textContent = "❌";
    title.textContent = t.wrong;
    message.textContent =
      t.watchRetry;

    rewards.style.display =
      "grid";

    document.getElementById(
      "quiz-double-btn"
    ).style.display =
      "none";

    document.getElementById(
      "quiz-retry-btn"
    ).style.display =
      "block";

    document.getElementById(
      "quiz-skip-btn"
    ).style.display =
      "none";

    next.style.display =
      "none";
  }
}

function startQuizTimer() {

  stopQuizTimer();

  quizTimeLeft = 60;

  updateQuizTimer();

  quizTimer =
    setInterval(() => {

      quizTimeLeft--;

      updateQuizTimer();

      if (
        quizTimeLeft <= 0
      ) {

        stopQuizTimer();

        handleQuizTimeUp();
      }

    }, 1000);
}

function updateQuizTimer() {

  const timer =
    document.getElementById(
      "quiz-timer"
    );

  if (timer) {

    timer.textContent =
      Math.max(
        0,
        quizTimeLeft
      );
  }
}

function stopQuizTimer() {

  if (quizTimer) {

    clearInterval(
      quizTimer
    );

    quizTimer = null;
  }
}

function handleQuizTimeUp() {

  if (
    quizAnswered ||
    !quizQuestionId
  ) {
    return;
  }

  quizAnswered = true;

  document
    .querySelectorAll(
      ".quiz-answer-btn"
    )
    .forEach(
      btn =>
        btn.disabled = true
    );

  showQuizResult(
    false,
    true
  );
}

async function quizReward(action) {

  const userId =
    getQuizUserId();

  if (
    !userId ||
    !quizQuestionId
  ) {
    return;
  }

  if (
    ![
      "double",
      "retry",
      "skip"
    ].includes(action)
  ) {
    return;
  }

  try {

    const createResponse =
      await fetch(
        `${API}/api/quiz/reward/create`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              userId:
                userId,

              questionId:
                quizQuestionId,

              action:
                action
            })
        }
      );

    const createData =
      await createResponse.json();

    if (!createData.success) {

      alert(
        createData.message ||
        "Unable to create reward session."
      );

      return;
    }

    const rewardId =
      createData.rewardId;

    if (!rewardId) {

      alert(
        "Invalid reward session."
      );

      return;
    }

    localStorage.setItem(
      "quiz_reward_id",
      rewardId
    );

    localStorage.setItem(
      "quiz_reward_action",
      action
    );

    localStorage.setItem(
      "quiz_reward_question_id",
      quizQuestionId
    );

    const references = {
      double: "quiz-doub",
      retry: "quiz-retry",
      skip: "quiz-skip"
    };

    window.location.href =
      `go:${references[action]}`;

  } catch (error) {

    console.error(
      "Quiz reward error:",
      error
    );

    alert(
      "Unable to start rewarded video."
    );
  }
}

async function completeQuizReward() {

  const rewardId =
    localStorage.getItem(
      "quiz_reward_id"
    );

  const userId =
    getQuizUserId();

  if (
    !rewardId ||
    !userId
  ) {
    return;
  }

  try {

    const response =
      await fetch(
        `${API}/api/quiz/reward/complete`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              rewardId:
                rewardId,

              userId:
                userId
            })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "Reward could not be completed."
      );

      return;
    }

    localStorage.removeItem(
      "quiz_reward_id"
    );

    localStorage.removeItem(
      "quiz_reward_action"
    );

    localStorage.removeItem(
      "quiz_reward_question_id"
    );

    await loadQuizPoints();

    /*
      Retry:
      لا نطلب سؤالًا جديدًا.
      نستخدم نفس questionId ونسمح
      للمستخدم بالإجابة مرة أخرى.
    */

    if (
      data.action === "retry"
    ) {

      quizAnswered = false;

      const result =
        document.getElementById(
          "quiz-result"
        );

      if (result) {
        result.style.display =
          "none";
      }

      document
        .querySelectorAll(
          ".quiz-answer-btn"
        )
        .forEach(
          btn =>
            btn.disabled = false
        );

      startQuizTimer();

      return;
    }

    /*
      Double / Skip:
      السؤال انتهى، لذلك ننتقل للسؤال التالي.
    */

    if (
      data.action === "double" ||
      data.action === "skip"
    ) {

      await loadQuizQuestion();
    }

  } catch (error) {

    console.error(
      "Complete quiz reward error:",
      error
    );

    alert(
      "Unable to complete reward."
    );
  }
}

function nextQuizQuestion() {
  loadQuizQuestion();
}

async function loadQuizPoints() {

  const userId =
    getQuizUserId();

  if (!userId) return;

  try {

    const response =
      await fetch(
        `${API}/api/quiz/points` +
        `?user_id=${encodeURIComponent(userId)}`
      );

    const data =
      await response.json();

    if (!data.success) return;

    document.getElementById(
      "quiz-points"
    ).textContent =
      Number(
        data.points || 0
      );

    document.getElementById(
      "quiz-today"
    ).textContent =
      Number(
        data.questions_today || 0
      );

    document.getElementById(
      "quiz-weekly"
    ).textContent =
      Number(
        data.weekly_score || 0
      );

    if (
      data.settings
    ) {

      document.getElementById(
        "quiz-left"
      ).textContent =
        Math.max(
          0,
          Number(
            data.settings
              .max_questions_per_day ||
            0
          ) -
          Number(
            data.questions_today ||
            0
          )
        );
    }

    renderQuizLeaderboard(
      data.leaderboard || []
    );

  } catch (error) {

    console.error(
      "Quiz points error:",
      error
    );
  }
}

function renderQuizLeaderboard(
  rows
) {

  const container =
    document.getElementById(
      "quiz-leaderboard-list"
    );

  if (!container) return;

  if (!rows.length) {

    container.textContent =
      "No leaderboard data yet.";

    return;
  }

  container.innerHTML = "";

  rows.forEach(
    (row, index) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "quiz-leaderboard-row";

      const username =
        row.username ||
        "User";

      const score =
        Number(
          row.weekly_score || 0
        );

      div.textContent =
        `${index + 1}. ${username} — ${score}`;

      container.appendChild(
        div
      );
    }
  );
}

async function openQuizConvert() {

  const userId =
    getQuizUserId();

  if (!userId) return;

  const points =
    Number(
      document.getElementById(
        "quiz-points"
      )?.textContent || 0
    );

  if (points <= 0) {

    alert(
      "You do not have enough points."
    );

    return;
  }

  const t =
    quizTranslations[
      quizCurrentLanguage
    ] ||
    quizTranslations.en;

  const value =
    prompt(
      t.conversionPrompt,
      points
    );

  if (value === null) return;

  const requested =
    Number(value);

  if (
    !Number.isInteger(requested) ||
    requested <= 0
  ) {

    alert(
      "Invalid points."
    );

    return;
  }

  try {

    const response =
      await fetch(
        `${API}/api/quiz/convert`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              userId:
                userId,

              pointsToConvert:
                requested
            })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "Conversion failed."
      );

      return;
    }

    alert(
      `+$${data.usd_added}`
    );

    await loadQuizPoints();

  } catch (error) {

    console.error(
      "Quiz conversion error:",
      error
    );

    alert(
      "Conversion failed."
    );
  }
}

function showQuizLimit(
  message
) {

  const limit =
    document.getElementById(
      "quiz-limit"
    );

  if (!limit) return;

  limit.textContent =
    message;

  limit.style.display =
    "block";
}

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const select =
      document.getElementById(
        "quiz-language"
      );

    if (select) {
      select.value =
        quizCurrentLanguage;
    }

    applyQuizTranslations();

    loadQuizPage();
  }
);
</script>
