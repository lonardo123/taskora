<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taskora Quiz</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 15px; }
  
  /* Header Stats */
  .header-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
  .stat-box { background: var(--bg-card); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
  .stat-box .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .value { font-size: 18px; font-weight: 700; color: var(--warning); margin-top: 4px; }
  
  /* Controls */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .lang-select { background: var(--bg-card); color: var(--text-primary); border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; }
  .convert-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }

  /* Timer Bar */
  .timer-container { background: var(--bg-card); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
  .timer-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .timer-bar-bg { background: var(--bg-input); height: 8px; border-radius: 4px; overflow: hidden; }
  .timer-bar-fill { background: linear-gradient(90deg, var(--success), var(--warning), var(--danger)); height: 100%; width: 100%; transition: width 1s linear; }
  .timer-bar-fill.danger { background: var(--danger); animation: pulse 1s infinite; }

  /* Question Card */
  .question-card { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 15px; }
  .q-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
  .q-meta span.badge { background: var(--bg-input); padding: 4px 8px; border-radius: 6px; }
  .q-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; min-height: 60px; }
  
  /* Answers */
  .answers-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .answer-btn { background: var(--bg-input); color: var(--text-primary); border: 2px solid transparent; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-align: left; }
  .answer-btn:hover { border-color: var(--accent); background: #1e3a8a; }
  .answer-btn.correct { border-color: var(--success); background: #064e3b; color: #86efac; }
  .answer-btn.wrong { border-color: var(--danger); background: #7f1d1d; color: #fca5a5; }
  .answer-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Action Buttons (Double/Retry/Skip) */
  .action-area { display: none; text-align: center; margin-top: 20px; animation: fadeIn 0.3s ease; }
  .action-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-double { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
  .btn-retry { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
  .btn-skip { background: linear-gradient(135deg, #64748b, #475569); color: white; }
  .btn-next { background: linear-gradient(135deg, var(--success), #16a34a); color: white; }

  /* Leaderboard */
  .leaderboard { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-top: 20px; }
  .lb-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .lb-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 14px; }
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { width: 30px; font-weight: 700; color: var(--warning); }

  /* Loading & Messages */
  .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--bg-input); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</has context>
</style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <p id="loadingText">Loading Quiz...</p>
</div>

<!-- Header Stats -->
<div class="header-stats">
  <div class="stat-box">
    <div class="label" data-i18n="points">Points</div>
    <div class="value" id="statPoints">0</div>
  </div>
  <div class="stat-box">
    <div class="label" data-i18n="today">Today</div>
    <div class="value" id="statToday">0</div>
  </div>
  <div class="stat-box">
    <div class="label" data-i18n="weekly">Weekly</div>
    <div class="value" id="statWeekly">0</div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
    <option value="en">🇬🇧 English</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="fr">🇫🇷 Français</option>
    <option value="es">🇪🇸 Español</option>
    <option value="pt">🇵🇹 Português</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="ja">🇯🇵 日本語</option>
  </select>
  <button class="convert-btn" onclick="convertPoints()" data-i18n="convert">Convert Points</button>
</div>

<!-- Timer -->
<div class="timer-container">
  <div class="timer-header">
    <span data-i18n="timeRemaining">Time Remaining</span>
    <span id="timerText" style="color: var(--warning); font-weight: 700;">60s</span>
  </div>
  <div class="timer-bar-bg">
    <div id="timerBar" class="timer-bar-fill"></div>
  </div>
</div>

<!-- Question Area -->
<div class="question-card" id="questionArea">
  <div class="q-meta">
    <span class="badge" id="qCategory">Category</span>
    <span class="badge" id="qDifficulty">⭐</span>
    <span class="badge" id="qLeft">Left: 200</span>
  </div>
  <div class="q-text" id="qText">Loading question...</div>
  <div class="answers-grid" id="answersGrid"></div>
  
  <!-- Action Area (Hidden by default) -->
  <div class="action-area" id="actionArea">
    <h3 id="actionTitle" style="margin-bottom: 15px; font-size: 18px;"></h3>
    <button id="btnDouble" class="action-btn btn-double" onclick="requestReward('double')">🎬 <span data-i18n="doublePoints">Double Points</span></button>
    <button id="btnRetry" class="action-btn btn-retry" onclick="requestReward('retry')">🔄 <span data-i18n="retry">Retry Question</span></button>
    <button id="btnSkip" class="action-btn btn-skip" onclick="requestReward('skip')">⏭️ <span data-i18n="skip">Skip Question</span></button>
    <button id="btnNext" class="action-btn btn-next" onclick="loadQuestion()" style="display:none;">➡️ <span data-i18n="next">Next Question</span></button>
  </div>
</div>

<!-- Leaderboard -->
<div class="leaderboard">
  <div class="lb-title">🏆 <span data-i18n="leaderboard">Weekly Leaderboard</span></div>
  <div id="leaderboardList">
    <div class="lb-item" style="justify-content: center; color: var(--text-secondary);">Loading...</div>
  </div>
</div>

<script>
// ================= CONFIG & STATE =================
const API_BASE = 'https://taskora.taskora.workers.dev'; // عدل هذا إذا كان مختلفاً
let quizUserId = null;
let currentQuestionId = null;
let currentLang = localStorage.getItem('quiz_language') || 'en';
let timerInterval = null;
let timeLeft = 60;

// ================= TRANSLATIONS =================
const translations = {
  en: { points: 'Points', today: 'Today', weekly: 'Weekly', convert: 'Convert', timeRemaining: 'Time Remaining', doublePoints: 'Double Points', retry: 'Retry Question', skip: 'Skip Question', next: 'Next Question', leaderboard: 'Weekly Leaderboard', correct: 'Correct! 🎉', wrong: 'Wrong Answer 😔', timeUp: 'Time\'s Up! ⏰', watchAdDouble: 'Watch ad to double your points!', watchAdRetry: 'Watch ad to try again!', watchAdSkip: 'Watch ad to skip this question!' },
  ar: { points: 'النقاط', today: 'اليوم', weekly: 'أسبوعي', convert: 'تحويل', timeRemaining: 'الوقت المتبقي', doublePoints: 'مضاعفة النقاط', retry: 'إعادة المحاولة', skip: 'تخطي السؤال', next: 'السؤال التالي', leaderboard: 'المتصدرون أسبوعياً', correct: 'إجابة صحيحة! 🎉', wrong: 'إجابة خاطئة 😔', timeUp: 'انتهى الوقت! ⏰', watchAdDouble: 'شاهد إعلاناً لمضاعفة نقاطك!', watchAdRetry: 'شاهد إعلاناً لإعادة المحاولة!', watchAdSkip: 'شاهد إعلاناً لتخطي هذا السؤال!' },
  fr: { points: 'Points', today: 'Aujourd\'hui', weekly: 'Hebdo', convert: 'Convertir', timeRemaining: 'Temps restant', doublePoints: 'Doubler les points', retry: 'Réessayer', skip: 'Passer', next: 'Suivant', leaderboard: 'Classement Hebdo', correct: 'Correct ! 🎉', wrong: 'Faux 😔', timeUp: 'Temps écoulé ! ⏰', watchAdDouble: 'Regardez une pub pour doubler !', watchAdRetry: 'Regardez une pub pour réessayer !', watchAdSkip: 'Regardez une pub pour passer !' },
  es: { points: 'Puntos', today: 'Hoy', weekly: 'Semanal', convert: 'Convertir', timeRemaining: 'Tiempo restante', doublePoints: 'Duplicar puntos', retry: 'Reintentar', skip: 'Saltar', next: 'Siguiente', leaderboard: 'Clasificación Semanal', correct: '¡Correcto! 🎉', wrong: 'Incorrecto 😔', timeUp: '¡Tiempo agotado! ⏰', watchAdDouble: '¡Mira un anuncio para duplicar!', watchAdRetry: '¡Mira un anuncio para reintentar!', watchAdSkip: '¡Mira un anuncio para saltar!' }
};

// ================= INITIALIZATION =================
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  quizUserId = urlParams.get('user_id')?.trim();
  
  if (!quizUserId || !/^\d+$/.test(quizUserId)) {
    document.body.innerHTML = '<div style="text-align:center;padding:50px;color:#ef4444;">Invalid or missing user_id in URL.</div>';
    return;
  }

  document.getElementById('langSelect').value = currentLang;
  applyTranslations();
  
  // التحقق من العودة من إعلان AppCreator24
  const returningRewardId = sessionStorage.getItem('quiz_reward_id');
  const returningAction = sessionStorage.getItem('quiz_reward_action');
  
  if (returningRewardId && returningAction) {
    completeReward(returningRewardId);
  } else {
    loadUserDataAndQuestion();
  }
});

// ================= CORE FUNCTIONS =================
function applyTranslations() {
  const t = translations[currentLang] || translations.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('quiz_language', lang);
  applyTranslations();
  loadQuestion(); // إعادة تحميل السؤال باللغة الجديدة
}

async function loadUserDataAndQuestion() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  try {
    // 1. جلب بيانات المستخدم والمتصدرين
    const res = await fetch(`${API_BASE}/api/quiz/points?user_id=${quizUserId}`);
    const data = await res.json();
    if (data.success) {
      document.getElementById('statPoints').textContent = data.points;
      document.getElementById('statToday').textContent = data.questions_today;
      document.getElementById('statWeekly').textContent = data.weekly_score;
      renderLeaderboard(data.leaderboard);
    }
    // 2. جلب السؤال
    await loadQuestion();
  } catch (err) {
    console.error('Init error:', err);
    document.getElementById('loadingText').textContent = 'Connection Error. Tap to retry.';
    document.getElementById('loadingOverlay').onclick = loadUserDataAndQuestion;
  }
}

async function loadQuestion() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('actionArea').style.display = 'none';
  document.getElementById('answersGrid').innerHTML = '';
  
  try {
    const res = await fetch(`${API_BASE}/api/quiz/question?user_id=${quizUserId}&lang=${currentLang}`);
    const data = await res.json();
    
    if (!data.success) {
      if (data.message === 'DAILY_LIMIT') {
        document.getElementById('qText').textContent = currentLang === 'ar' ? 'لقد وصلت للحد اليومي (200 سؤال). عد غداً!' : 'Daily limit (200) reached. Come back tomorrow!';
        document.getElementById('loadingOverlay').style.display = 'none';
        return;
      }
      throw new Error(data.message);
    }

    currentQuestionId = data.questionId;
    document.getElementById('qCategory').textContent = data.category;
    document.getElementById('qDifficulty').textContent = data.difficulty === 'easy' ? '⭐' : data.difficulty === 'medium' ? '⭐⭐' : '⭐⭐⭐';
    document.getElementById('qLeft').textContent = (currentLang === 'ar' ? 'متبقي: ' : 'Left: ') + data.questionsLeft;
    document.getElementById('qText').textContent = data.question;

    const grid = document.getElementById('answersGrid');
    data.answers.forEach((ans, idx) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = ans;
      btn.onclick = () => submitAnswer(idx);
      grid.appendChild(btn);
    });

    document.getElementById('loadingOverlay').style.display = 'none';
    startTimer();

  } catch (err) {
    document.getElementById('loadingText').textContent = 'Failed to load question. Tap to retry.';
    document.getElementById('loadingOverlay').onclick = loadQuestion;
  }
}

// ================= TIMER LOGIC =================
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 60;
  updateTimerUI();
  
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timerText').textContent = timeLeft + 's';
  const bar = document.getElementById('timerBar');
  bar.style.width = (timeLeft / 60 * 100) + '%';
  if (timeLeft <= 10) bar.classList.add('danger');
  else bar.classList.remove('danger');
}

function handleTimeUp() {
  disableAnswers();
  showActionArea('timeUp', 'skip');
}

// ================= ANSWER LOGIC =================
async function submitAnswer(answerIndex) {
  clearInterval(timerInterval);
  disableAnswers();
  
  try {
    const res = await fetch(`${API_BASE}/api/quiz/answer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: quizUserId, questionId: currentQuestionId, answerIndex })
    });
    const data = await res.json();
    
    const btns = document.querySelectorAll('.answer-btn');
    btns[data.correctIndex].classList.add('correct');
    
    if (data.correct) {
      showActionArea('correct', 'double');
    } else {
      btns[answerIndex].classList.add('wrong');
      showActionArea('wrong', 'retry');
    }
    
    // تحديث النقاط في الواجهة فوراً
    const ptsRes = await fetch(`${API_BASE}/api/quiz/points?user_id=${quizUserId}`);
    const ptsData = await ptsRes.json();
    if (ptsData.success) document.getElementById('statPoints').textContent = ptsData.points;

  } catch (err) {
    console.error('Submit error:', err);
    loadQuestion();
  }
}

function disableAnswers() {
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.disabled = true;
    btn.style.cursor = 'default';
  });
}

function showActionArea(resultKey, primaryAction) {
  const t = translations[currentLang] || translations.en;
  const area = document.getElementById('actionArea');
  const title = document.getElementById('actionTitle');
  
  document.getElementById('btnDouble').style.display = primaryAction === 'double' ? 'flex' : 'none';
  document.getElementById('btnRetry').style.display = primaryAction === 'retry' ? 'flex' : 'none';
  document.getElementById('btnSkip').style.display = primaryAction === 'skip' ? 'flex' : 'none';
  document.getElementById('btnNext').style.display = 'none'; // يظهر بعد اكتمال المكافأة

  if (resultKey === 'correct') {
    title.textContent = t.correct;
    title.style.color = 'var(--success)';
    document.getElementById('btnDouble').querySelector('span').textContent = t.watchAdDouble;
  } else if (resultKey === 'wrong') {
    title.textContent = t.wrong;
    title.style.color = 'var(--danger)';
    document.getElementById('btnRetry').querySelector('span').textContent = t.watchAdRetry;
  } else {
    title.textContent = t.timeUp;
    title.style.color = 'var(--warning)';
    document.getElementById('btnSkip').querySelector('span').textContent = t.watchAdSkip;
  }
  
  area.style.display = 'block';
}

// ================= REWARD & APPCREATOR24 FLOW =================
async function requestReward(action) {
  // إخفاء أي رسائل سابقة وعرض مؤشر تحميل بسيط (بدون نصوص مزعجة)
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.style.display = 'flex';

  try {
    // 1. إنشاء جلسة المكافأة في السيرفر
    const res = await fetch(`https://taskora.taskora.workers.dev/api/quiz/reward/create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: quizUserId, questionId: currentQuestionId, action })
    });
    const data = await res.json();
    
    if (!data.success) {
      if (overlay) overlay.style.display = 'none';
      // في حال الفشل، نعود للسؤال التالي بصمت دون إظهار alert
      loadQuestion();
      return;
    }
    
    // 2. ✅ الحفظ الآمن في sessionStorage (هذا هو السطر الذي كان ينقصنا)
    sessionStorage.setItem('quiz_user_id', quizUserId);
    sessionStorage.setItem('quiz_reward_id', data.rewardId);
    sessionStorage.setItem('quiz_reward_action', action);
    sessionStorage.setItem('quiz_reward_question_id', currentQuestionId);
    
    // 3. التوجيه إلى قسم AppCreator24 الصحيح
    let ac24Ref = '';
    if (action === 'double') ac24Ref = 'quiz-doub';
    else if (action === 'retry') ac24Ref = 'quiz-retry';
    else if (action === 'skip') ac24Ref = 'quiz-skip';
    
    // التحويل الفوري
    setTimeout(() => {
      window.location.href = `go:${ac24Ref}`;
    }, 300);
    
  } catch (err) {
    console.error('Reward request error:', err);
    if (overlay) overlay.style.display = 'none';
    loadQuestion(); // عودة صامتة في حال فشل الاتصال
  }
}

async function completeReward(rewardId) {
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('loadingText').textContent = 'Verifying reward...';
  
  try {
    const res = await fetch(`${API_BASE}/api/quiz/reward/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rewardId, userId: quizUserId })
    });
    const data = await res.json();
    
    // تنظيف sessionStorage
    sessionStorage.removeItem('quiz_reward_id');
    sessionStorage.removeItem('quiz_reward_action');
    sessionStorage.removeItem('quiz_reward_question_id');
    
    if (data.success) {
      // تحديث الواجهة وإظهار زر "السؤال التالي"
      document.getElementById('actionArea').querySelectorAll('button').forEach(b => b.style.display = 'none');
      document.getElementById('btnNext').style.display = 'flex';
      document.getElementById('actionTitle').textContent = `+${data.pointsEarned} Points! 🎉`;
      document.getElementById('actionTitle').style.color = 'var(--success)';
      
      // تحديث النقاط
      const ptsRes = await fetch(`${API_BASE}/api/quiz/points?user_id=${quizUserId}`);
      const ptsData = await ptsRes.json();
      if (ptsData.success) document.getElementById('statPoints').textContent = ptsData.points;
    } else {
      alert('Reward verification failed: ' + data.message);
      loadQuestion();
    }
  } catch (err) {
    console.error('Complete reward error:', err);
    alert('Connection error during verification.');
    loadQuestion();
  } finally {
    document.getElementById('loadingOverlay').style.display = 'none';
  }
}

// ================= UTILS =================
function renderLeaderboard(data) {
  const list = document.getElementById('leaderboardList');
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="lb-item" style="justify-content: center; color: var(--text-secondary);">No data yet</div>';
    return;
  }
  list.innerHTML = data.map((row, i) => `
    <div class="lb-item">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="lb-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)}</span>
        <span>@${row.username || 'User'}</span>
      </div>
      <span style="font-weight:700;color:var(--warning);">${row.weekly_score} pts</span>
    </div>
  `).join('');
}

function convertPoints() {
  // يمكن ربط هذا بـ Modal أو توجيه لصفحة التحويل
  alert('Conversion feature: 1000 points = $0.10 (Configurable by Admin)');
}
</script>
</body>
</html>
