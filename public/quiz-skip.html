<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Processing...</title>
<style>
  body { 
    background: #0f172a; 
    color: white; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    height: 100vh; 
    margin: 0; 
    font-family: sans-serif; 
    overflow: hidden;
  }
  .spinner { 
    width: 40px; 
    height: 40px; 
    border: 4px solid #334155; 
    border-top-color: #8b5cf6; 
    border-radius: 50%; 
    animation: spin 1s linear infinite; 
    margin-bottom: 20px; 
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h3 id="statusText">⏭️ Skipping Question...</h3>
  <p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">Verifying with server</p>

  <script>
    async function complete() {
      // ✅ القراءة من localStorage (أكثر أماناً في AppCreator24)
      const userId = localStorage.getItem('quiz_user_id');
      const rewardId = localStorage.getItem('quiz_reward_id');
      
      // إذا كانت البيانات مفقودة، نعود لصفحة الكويز فوراً وبصمت تام (بدون أي رسائل)
      if (!userId || !rewardId) {
        window.location.href = 'go:quiz';
        return;
      }

      try {
        const res = await fetch('https://taskora.taskora.workers.dev/api/quiz/reward/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rewardId, userId: userId })
        });
        
        // تنظيف البيانات بعد الاستخدام
        localStorage.removeItem('quiz_reward_id');
        localStorage.removeItem('quiz_reward_action');
        localStorage.removeItem('quiz_reward_question_id');
        // ملاحظة: نحتفظ بـ quiz_user_id في localStorage لأنه قد يحتاجه لاحقاً
        
        // العودة إلى صفحة الكويز الرئيسية
        window.location.href = `go:quiz`;
        
      } catch (e) {
        console.error(e);
        // في حال فشل الاتصال، نعود أيضاً لصفحة الكويز بصمت
        window.location.href = `go:quiz`;
      }
    }
    
    // تنفيذ الدالة فور تحميل الصفحة
    window.onload = complete;
  </script>
</body>
</html>
