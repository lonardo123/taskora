name: Generate package-lock.json

on:
  workflow_dispatch:  # يُشغّل يدوياً من تبويب Actions

# ✅ إضافة صلاحيات الكتابة للمستودع (هذا هو السبب الرئيسي للخطأ 128)
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          
          # التحقق مما إذا كان هناك تغييرات فعلياً قبل الدفع
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "chore: auto-generate package-lock.json"
            git push origin HEAD:main
          fi
