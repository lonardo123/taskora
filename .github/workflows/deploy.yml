name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Generate Lock File
        run: |
          # ✅ استخدام npm install بدلاً من npm ci
          # npm install سيقوم بإنشاء package-lock.json تلقائياً إذا لم يكن موجوداً
          npm install
          
          # ✅ التحقق من وجود الملف
          if [ ! -f package-lock.json ]; then
            echo "❌ Failed to generate package-lock.json"
            exit 1
          fi
          echo "✅ package-lock.json generated successfully"

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
